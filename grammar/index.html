<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语法互动 · 全部章节</title>
  <link rel="stylesheet" href="grammar-common.css">
  <style>
    .gm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 16px; }
    .gm-chap {
      display: block; text-decoration: none; color: var(--text-primary);
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
      padding: 16px 18px; transition: var(--transition-fast); position: relative;
    }
    .gm-chap:hover { border-color: var(--huo-color); transform: translateY(-3px); box-shadow: 0 10px 26px -12px var(--huo-2); }
    .gm-chap .gm-chap-ic { font-size: 1.6rem; }
    .gm-chap .gm-chap-t { font-weight: 800; font-size: 1rem; margin: 8px 0 4px; }
    .gm-chap .gm-chap-d { font-size: 0.8rem; color: var(--text-muted); }
    .gm-chap .gm-chap-badge {
      position: absolute; top: 14px; right: 14px; font-size: 0.68rem; font-weight: 800;
      padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.08); color: var(--text-muted);
    }
    .gm-chap.done .gm-chap-badge { background: linear-gradient(135deg, var(--huo-color), var(--huo-2)); color: #fff; }
    .gm-home-link { display: inline-block; margin-top: 18px; color: var(--huo-color); font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="gm-wrap">
    <div class="gm-topbar">
      <h1>🔥 语法互动课堂</h1>
      <span class="gm-badge">火宝宝陪你学</span>
    </div>
    <p style="color:var(--text-muted); font-size:.9rem; margin:0;">13 个语法大章，点开就能学一点、练一点。视频版权问题？不存在的，全是原创讲解～</p>
    <div class="gm-user-hb" id="gm-user-hb"></div>
    <div class="gm-grid" id="gm-grid"></div>
    <a class="gm-home-link" href="../index.html">← 返回 App 首页</a>
  </div>
  <script src="grammar-data.js"></script>
  <script src="grammar-common.js"></script>
  <script>
    (function () {
      var MODULES = window.GRAMMAR_MODULES || {};
      var KEY = 'grammarModuleProgress';
      function getProgress() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
      var prog = getProgress();
      var grid = document.getElementById('gm-grid');
      var html = '';
      Object.keys(MODULES).forEach(function (id) {
        var m = MODULES[id];
        var done = prog[id] && prog[id].done;
        var sub = done ? ('已通关 · ' + prog[id].correct + '/' + prog[id].total) : (m.desc || (m.sections.length + ' 个小节'));
        html += '<a class="gm-chap' + (done ? ' done' : '') + '" href="grammar.html?id=' + id + '">' +
          '<span class="gm-chap-badge">' + (done ? '✓ 完成' : m.diff) + '</span>' +
          '<div class="gm-chap-ic">' + m.icon + '</div>' +
          '<div class="gm-chap-t">' + m.title + '</div>' +
          '<div class="gm-chap-d">' + ((m.desc || (m.sections.length + ' 个小节')) || '') + '</div>' +
          '<div class="gm-chap-d" style="margin-top:6px;color:var(--huo-color);font-weight:700;">' + (done ? sub : '开始学习 →') + '</div>' +
          '</a>';
      });
      grid.innerHTML = html;

      // 顶部「你的火宝宝」等级条：与 App 主页完全同步（同一成长值）
      var hb = (typeof window.getHuobaoState === 'function')
        ? window.getHuobaoState()
        : { level: 1, name: '小火苗', growth: 0, variant: 'fire' };
      var uhb = document.getElementById('gm-user-hb');
      if (uhb) {
        uhb.innerHTML =
          '<img class="gm-user-hb-img' + (hb.variant === 'ice' ? ' gm-img-ice' : '') + '" src="../assets/qilin/qilin-' + hb.level + '.png" alt="火宝宝">' +
          '<div><div class="gm-user-hb-name">你的火宝宝 · Lv.' + hb.level + ' ' + hb.name + '</div>' +
          '<div class="gm-user-hb-sub">成长值 ' + hb.growth + ' · 和 App 主页同步</div></div>';
      }
    })();
  </script>
</body>
</html>
